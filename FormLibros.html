<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Añadir Libro - Biblioteca</title>
</head>
<body>
    <h2>Añadir un nuevo libro</h2>
    <form action="crealibro.php" method="POST">
        <label>Nombre:</label><br>
        <input type="text" name="nombre" required><br><br>
        
        <label>Autor:</label><br>
        <input type="text" name="autor" required><br><br>
        
        <label>ISBN (máx 13 caracteres):</label><br>
        <input type="text" name="isbn" maxlength="13" required><br><br>
        
        <label>Puntuación:</label><br>
        <input type="number" name="puntuacion" required><br><br>
        
        <label>Género:</label><br>
        <input type="text" name="genero" required><br><br>
        
        <input type="submit" value="Guardar Libro">
    </form>
</body>
</html>
